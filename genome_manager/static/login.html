<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — NCBI Genome Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: linear-gradient(135deg, #1a2a4a 0%, #1a5276 100%); }
    .login-card { border: none; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    .login-brand i { font-size: 2.5rem; color: #3498db; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card login-card" style="width:400px">
    <div class="card-body p-5">
      <div class="text-center mb-4 login-brand">
        <i class="bi bi-diagram-3-fill"></i>
        <h4 class="mt-2 fw-bold text-dark">NCBI Genome Manager</h4>
        <p class="text-muted small mb-0">管理后台登录</p>
      </div>

      <div id="login-success" class="alert alert-success py-2 small d-none">
        <i class="bi bi-check-circle me-1"></i>管理员账号设置成功，请登录。
      </div>

      <div id="login-error" class="alert alert-danger py-2 small d-none">
        <i class="bi bi-exclamation-circle me-1"></i>用户名或密码错误，请重试。
      </div>

      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="username" class="form-control"
                   placeholder="admin" autofocus autocomplete="username" required />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" id="pwdInput" class="form-control"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="btn btn-outline-secondary"
                    onclick="var i=document.getElementById('pwdInput');i.type=i.type==='password'?'text':'password'">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>登录
        </button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('error') === '1') {
      document.getElementById('login-error').classList.remove('d-none');
    }
    if (params.get('setup') === '1') {
      document.getElementById('login-success').classList.remove('d-none');
    }
  </script>
</body>
</html>
