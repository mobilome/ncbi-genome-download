<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初始设置 — NCBI Genome Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: linear-gradient(135deg, #1a2a4a 0%, #1a5276 100%); }
    .setup-card { border: none; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    .setup-brand i { font-size: 2.5rem; color: #3498db; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="card setup-card" style="width:420px">
    <div class="card-body p-5">
      <div class="text-center mb-4 setup-brand">
        <i class="bi bi-diagram-3-fill"></i>
        <h4 class="mt-2 fw-bold text-dark">NCBI Genome Manager</h4>
        <p class="text-muted small mb-0">首次启动 — 请设置管理员账号</p>
      </div>

      <div class="alert alert-info py-2 small mb-4">
        <i class="bi bi-info-circle me-1"></i>
        此页面仅在首次启动时可用，设置完成后将自动关闭。
      </div>

      <div id="setup-error" class="alert alert-danger py-2 small d-none"></div>

      <form id="setupForm" method="post" action="/setup" onsubmit="return validate()">
        <div class="mb-3">
          <label class="form-label fw-semibold">管理员用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="username" id="username" class="form-control"
                   placeholder="admin" autofocus autocomplete="username" required
                   minlength="2" maxlength="64" />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" id="password" class="form-control"
                   placeholder="至少 8 位" autocomplete="new-password" required
                   minlength="8" maxlength="128" />
            <button type="button" class="btn btn-outline-secondary"
                    onclick="togglePwd('password')">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">确认密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="confirm" class="form-control"
                   placeholder="再次输入密码" autocomplete="new-password" required
                   minlength="8" maxlength="128" />
            <button type="button" class="btn btn-outline-secondary"
                    onclick="togglePwd('confirm')">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-check-circle me-2"></i>完成设置并登录
        </button>
      </form>
    </div>
  </div>

  <script>
    function togglePwd(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function validate() {
      const pwd = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const errEl = document.getElementById('setup-error');
      if (pwd !== confirm) {
        errEl.textContent = '两次输入的密码不一致，请重新输入。';
        errEl.classList.remove('d-none');
        return false;
      }
      errEl.classList.add('d-none');
      return true;
    }
  </script>
</body>
</html>
